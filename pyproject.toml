[project]
name = "decoder-swap"
version = "0.0.1"
description = "Experiment: does token structure survive a re-voiced decoder?"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "descript-audio-codec>=1.0.0",
    "numpy<2.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decoder_swap"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
